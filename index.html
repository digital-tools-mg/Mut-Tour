<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mut-Tour">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mut-Tour gegen Mobbing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: Bilderbuch-Schulgelände als Karte; Stationen öffnen eine Kartenspalte (Infokarten + Quiz), die sich Schritt für Schritt nach unten aufbaut.
   Bewusst ein helles Thema: Spielwelt wie ein Bilderbuch, gut lesbar am Beamer. */
:root{
  color-scheme: light;
  --sky:#e6f2fb;      /* Seitengrund */
  --ink:#1f2b3b;      /* Text */
  --muted:#56657a;
  --card:#ffffff;
  --line:#c8d7e6;
  --bus:#f2b632;      /* Schulbus-Gelb = Akzent */
  --bus-deep:#b07d0c;
  --board:#2f5d50;    /* Tafelgrün */
  --brick:#c8553d;
  --ok:#23845a; --ok-bg:#e3f4ea;
  --bad:#b9372a; --bad-bg:#fbe7e4;
  --lock:#9aa8b8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--board);outline-offset:3px}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{height:54px;width:auto;display:block}
.cert .certlogo{height:120px;width:auto}
.brand h1{font-size:1.5rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:12px 22px;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--bus);color:var(--ink);box-shadow:0 4px 0 var(--bus-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bus-deep)}
.btn.ghost{background:var(--card);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.green{background:var(--board);color:#fff;box-shadow:0 4px 0 #1b3a31}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;color:var(--board);font-weight:700;text-decoration:underline;padding:4px}

/* Startbildschirm */
.start{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--card);border-radius:24px;padding:28px;border:3px solid var(--ink)}
.start h2{font-size:clamp(2rem,5vw,3.1rem);font-weight:800}
.start h2 span{background:linear-gradient(transparent 58%,var(--bus) 58%)}
.start .lead{font-size:1.1rem;margin-top:12px;max-width:52ch}
.start form{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.start label{font-weight:700}
.start input{font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;max-width:340px;background:#fff;color:var(--ink)}
.start .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.how{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding:0;list-style:none}
.how li{display:flex;gap:10px;align-items:flex-start}
.how b.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--board);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:.95rem}
details.teacher{background:var(--card);border-radius:16px;border:2px dashed var(--line);padding:12px 18px}
details.teacher summary{font-weight:700;cursor:pointer}
details.teacher ul{margin:10px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;color:var(--muted)}

/* Karte */
.mapwrap{position:relative;width:100%;max-width:100%;aspect-ratio:1000/500;border-radius:22px;overflow:hidden;border:3px solid var(--ink);background:#cfe7f7}
.mapwrap > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin .dot svg{display:block}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:0}
.pin .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--bus);border:3px solid var(--ink);font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--ink);box-shadow:0 4px 0 rgba(31,43,59,.35)}
.pin .lbl{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.pin .dot{animation:pinIn .5s cubic-bezier(.2,.9,.3,1.4) var(--d,0s) backwards}
.pin.next .dot{animation:pinIn .5s cubic-bezier(.2,.9,.3,1.4) var(--d,0s) backwards,bob 1.4s calc(var(--d,0s) + .6s) ease-in-out infinite}
.pin.done .dot{background:var(--ok);color:#fff}
.pin.locked .dot{background:#e4eaf1;border-color:var(--lock);color:var(--lock);box-shadow:none}
.pin.locked .lbl{border-color:var(--lock);color:var(--muted)}
.pin.locked{cursor:not-allowed}
.pin.final .dot{width:60px;height:60px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.pin.next .dot{animation:none}*{transition:none!important}}
@media (max-width:640px){.pin .lbl{display:none}.pin .dot{width:38px;height:38px;font-size:1rem}.pin.final .dot{width:44px;height:44px}}

.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.st{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;color:var(--ink);min-width:0}
.st .ic{flex:none;width:46px;height:46px}
.st b{display:block;font-family:var(--display);font-size:1.1rem;line-height:1.1}
.st small{color:var(--muted);font-size:.85rem}
.st.done{border-color:var(--ok)}
.st.done small{color:var(--ok);font-weight:700}
.st.locked{opacity:.55;cursor:not-allowed}
.st.next{border-color:var(--ink);box-shadow:0 4px 0 var(--bus)}
.hint{color:var(--muted);text-align:center}

/* Station */
.stationhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.stationhead h2{font-size:1.8rem;font-weight:800}
.pips{display:flex;gap:6px;margin-left:auto}
.pips i{width:14px;height:14px;border-radius:50%;background:#dbe4ee;border:2px solid var(--line)}
.pips i.on{background:var(--bus);border-color:var(--bus-deep)}
.pips i.ok{background:var(--ok);border-color:var(--ok)}
.scene{display:flex;gap:18px;align-items:center;background:var(--board);color:#f3f7f2;border-radius:20px;padding:18px 22px;border:6px solid #8a6a43}
.scene svg{flex:none;width:86px;height:86px}
.scene .time{font-family:var(--display);font-weight:800;color:var(--bus);font-size:1rem;letter-spacing:.04em}
.scene p{font-size:1.08rem;max-width:62ch}

.flow{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:18px;padding:20px 22px;border:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.card.new{animation:pop .55s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{transform:translateY(24px) scale(.97);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.tag{align-self:flex-start;font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;padding:2px 10px}
.info{border-color:var(--bus);border-width:3px}
.info .tag{background:var(--bus);color:var(--ink)}
.quiz .tag{background:var(--board);color:#fff}
.card h3{font-size:1.4rem;font-weight:800}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.card .big{font-size:1.12rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{border-radius:14px;padding:14px 16px;background:var(--sky);display:flex;flex-direction:column;gap:6px;min-width:0}
.box h4{margin:0;font-family:var(--display);font-size:1.15rem}
.box.warm{background:#fff3d6}
.box.green{background:var(--ok-bg)}
.box.red{background:var(--bad-bg)}
.note{background:#fff3d6;border-radius:12px;padding:10px 14px;font-weight:700}
.q{font-size:1.2rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--sky);border:2px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--ink);display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 16px;font-weight:400}
.fb b{display:block;font-family:var(--display);font-size:1.1rem}
.fb.good{background:var(--ok-bg);border-left:6px solid var(--ok)}
.fb.try{background:var(--bad-bg);border-left:6px solid var(--bad)}
.sortlist{display:flex;flex-direction:column;gap:10px}
.sortrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--sky);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.sortrow span{min-width:0;flex:1 1 220px}
.sortrow .cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.92rem;color:var(--ink)}
.cat.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.sortrow.right{border-color:var(--ok);background:var(--ok-bg)}
.sortrow.right .cat.sel{background:var(--ok);border-color:var(--ok)}
.sortrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.locked-card{border:2px dashed var(--lock);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:14px;color:var(--muted);background:rgba(255,255,255,.5)}
.locked-card svg{flex:none;width:30px;height:30px}
.solved{display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:700}
.end{border:3px solid var(--ok);background:var(--card)}
.end .tag{background:var(--ok);color:#fff}
.talk{background:var(--sky);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.talk b{font-family:var(--display);font-size:1.05rem}

/* Kreis-Diagramm */
.circle-wrap{overflow-x:auto}
.circle-wrap svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}

/* Hilfe */
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.help .box b.num{font-family:var(--display);font-size:1.8rem;letter-spacing:.03em;user-select:all;font-variant-numeric:tabular-nums}
.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start;background:var(--sky);border-radius:14px;padding:10px 14px}
.rules li b.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bus);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.rules li div{min-width:0}
.rules li strong{font-family:var(--display);font-size:1.12rem;display:block;line-height:1.2}

.promise{display:flex;flex-direction:column;gap:8px}
.promise label{display:flex;gap:12px;align-items:flex-start;background:var(--sky);border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer}
.promise input{width:22px;height:22px;margin-top:3px;accent-color:var(--board);flex:none}
.promise label:has(input:checked){border-color:var(--board);background:var(--ok-bg)}

/* Urkunde */
.cert{background:var(--card);border:10px double var(--board);border-radius:10px;padding:32px clamp(18px,4vw,48px);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.cert .eyebrow{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--brick);font-weight:800}
.cert h2{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800}
.cert .who{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.4rem);border-bottom:3px solid var(--bus);padding:0 24px;min-width:min(320px,100%)}
.cert ul{text-align:left;margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;max-width:520px}
.cert .stars{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.cert .stars svg{width:28px;height:28px}
.cert small{color:var(--muted)}

/* Bewegung */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sky);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--sky)}
.btn{transition:transform .12s,box-shadow .12s}
.btn:hover:not([disabled]){transform:translateY(-2px)}
.st{transition:transform .15s}
.st:not(.locked):hover{transform:translateY(-3px)}
.opt{transition:transform .12s,border-color .12s}
.opt:hover:not([disabled]){transform:translateX(4px)}
.cat{transition:transform .1s}
.cat:active{transform:scale(.94)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.fb.new{animation:fbIn .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes fbIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.chip.pulse{animation:pulse .6s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.25);background:#fff3d6}100%{transform:scale(1)}}
@keyframes pinIn{from{transform:scale(0)}to{transform:scale(1)}}
svg .clouds{animation:drift 26s linear infinite alternate}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
svg .sun{transform-box:fill-box;transform-origin:center;animation:sun 4s ease-in-out infinite}
@keyframes sun{50%{transform:scale(1.12)}}
svg .tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
svg .bus{animation:drive 4.5s cubic-bezier(.15,.6,.25,1) both,rumble .6s 4.5s ease-in-out infinite}
@keyframes drive{from{transform:translateX(-500px)}to{transform:translateX(0)}}
@keyframes rumble{50%{transform:translateY(-2px)}}
svg .ball{transform-box:fill-box;animation:ball 1.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes ball{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.scene > svg{animation:wiggle 3.5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(5deg)}30%{transform:rotate(0)}}
.guide{display:flex;align-items:center;justify-content:center;gap:14px}
.pet{width:68px;height:86px;flex:none;animation:hop 2.8s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
.pet .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{position:relative;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 16px;max-width:46ch;animation:fbIn .45s .4s cubic-bezier(.2,.9,.3,1.3) backwards}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:16px;height:16px;background:var(--card);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.end{position:relative}
.end h3{padding-right:96px}
.badge{position:absolute;right:16px;top:-20px;width:86px;height:86px;border-radius:50%;background:var(--card);border:4px solid var(--ok);padding:12px;transform:rotate(-10deg);box-shadow:0 4px 0 rgba(31,43,59,.2)}
.badge svg{width:100%;height:100%;display:block}
.end.new .badge{animation:stamp .6s .25s cubic-bezier(.2,.9,.3,1.5) backwards}
@keyframes stamp{from{transform:rotate(-40deg) scale(2.4);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.cert{animation:pop .6s cubic-bezier(.2,.9,.3,1.25)}
.cert .stars span{display:inline-block;animation:starpop .45s cubic-bezier(.2,.9,.3,1.6) backwards;animation-delay:calc(var(--i) * 70ms + .3s)}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.locked-card svg{animation:jiggle 2.5s ease-in-out infinite}
@keyframes jiggle{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}95%{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:760px){
  .start{grid-template-columns:minmax(0,1fr);padding:20px}
  .start .art{order:-1;max-width:320px;margin:0 auto}
  .scene{flex-direction:column;align-items:flex-start;padding:16px}
  .scene svg{width:60px;height:60px}
  .pips{margin-left:0}
  .card{padding:16px}
}
</style>

</head>
<body>

/* ---------- Spielstand ---------- */
const KEY="mut-tour-v1";
let S = load() || fresh();
function fresh(){return {name:"",started:false,prog:{},first:{},done:{},promises:[],view:"start",cur:null}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const stars=()=>Object.values(S.first).filter(v=>v===true).length;
const unlocked=(st)=>{ if(st.id==="finale") return STATIONS.every(s=>S.done[s.id]); const i=STATIONS.indexOf(st); return i===0||!!S.done[STATIONS[i-1].id]; };
const nextStation=()=>ALL.find(s=>!S.done[s.id]&&unlocked(s));

/* temporäre Antwortzustände pro Frage (nicht gespeichert) */
let tmp={};

const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function header(){
  const done=STATIONS.filter(s=>S.done[s.id]).length;
  return `<div class="top">
    <div class="brand"><img class="logo" src="${LOGO}" alt="Logo MPS St. Blasius Dornburg"><h1>Mut-Tour gegen Mobbing</h1></div>
    <div class="chips">
      ${S.name?`<span class="chip">${esc(S.name)}</span>`:""}
      <span class="chip" title="Stationen geschafft">Stationen ${done}/${STATIONS.length}</span>
      <span class="chip" id="starchip" title="Mut-Sterne: beim ersten Versuch richtig">${ICON.star()} ${stars()}/${QIDS.length}</span>
    </div></div>`;
}

/* ---------- Ansichten ---------- */
function render(){
  if(S.view==="map") return renderMap();
  if(S.view==="station") return renderStation();

  renderStart();
}

}

/* ---------- Schule mit vier Häusern (grün, blau, rot, gelb) ---------- */
function schoolSVG(){
  const W=180, T=320, B=495;
  const H=[{x:25,f:"#5cb85c",r:"#3d8a3d"},{x:281,f:"#4a86f0",r:"#2c5fc0"},{x:537,f:"#e8483f",r:"#a92b25"},{x:793,f:"#ffd23f",r:"#c2930f"}];
  const win=(x,y)=>`<rect x="${x}" y="${y}" width="36" height="44" rx="3" fill="#bfe3f5" stroke="#1f2b3b" stroke-width="2.5"/><path d="M${x+18} ${y}v44M${x} ${y+22}h36" stroke="#1f2b3b" stroke-width="1.5"/>`;
  const door=(x,w=34)=>`<rect x="${x}" y="${B-62}" width="${w}" height="62" rx="3" fill="#7a4b2c" stroke="#1f2b3b" stroke-width="2.5"/><circle cx="${x+w-8}" cy="${B-30}" r="3" fill="#f2b632"/>`;
  const up=336, dn=424, c=[12,54,96,138];
  let s="";
  H.forEach(h=>{
    s+=`<rect x="${h.x}" y="${T}" width="${W}" height="${B-T}" fill="${h.f}" stroke="#1f2b3b" stroke-width="3"/>`;
    s+=`<rect x="${h.x-6}" y="${T-12}" width="${W+12}" height="14" rx="2" fill="${h.r}" stroke="#1f2b3b" stroke-width="3"/>`;
    s+=`<line x1="${h.x}" y1="400" x2="${h.x+W}" y2="400" stroke="${h.r}" stroke-width="3"/>`;
  });
  const [g,bl,rd,ye]=H;
  // grünes Haus: 1. Stock Sanitätsraum, unten Aula-Eingang
  s+=win(g.x+c[0],up)+win(g.x+c[3],up);
  s+=`<rect x="${g.x+54}" y="${up}" width="78" height="44" rx="3" fill="#ffffff" stroke="#1f2b3b" stroke-width="2.5"/><rect x="${g.x+81}" y="${up+10}" width="24" height="24" rx="3" fill="#2c8a4a"/><path d="M${g.x+90} ${up+14}h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="#ffffff"/>`;
  s+=win(g.x+c[0],dn)+win(g.x+c[3],dn);
  s+=`<rect x="${g.x+52}" y="405" width="76" height="20" rx="4" fill="#ffffff" stroke="#1f2b3b" stroke-width="2.5"/><text x="${g.x+90}" y="420.5" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" font-size="15" fill="#1f2b3b">AULA</text>`;
  s+=`<rect x="${g.x+58}" y="429" width="64" height="66" rx="4" fill="#7a4b2c" stroke="#1f2b3b" stroke-width="3"/><line x1="${g.x+90}" y1="429" x2="${g.x+90}" y2="${B}" stroke="#1f2b3b" stroke-width="2.5"/><circle cx="${g.x+84}" cy="463" r="3.5" fill="#f2b632"/><circle cx="${g.x+96}" cy="463" r="3.5" fill="#f2b632"/>`;
  // blaues Haus: Klassenzimmer mit Tafel
  s+=`<rect x="${bl.x+c[0]}" y="${up}" width="36" height="44" rx="3" fill="#2f5d50" stroke="#1f2b3b" stroke-width="2.5"/><path d="M${bl.x+17} ${up+12}h18M${bl.x+17} ${up+21}h24M${bl.x+17} ${up+30}h12" stroke="#f3f7f2" stroke-width="2.5" stroke-linecap="round"/>`;
  s+=win(bl.x+c[1],up)+win(bl.x+c[2],up)+win(bl.x+c[3],up)+win(bl.x+c[0],dn)+win(bl.x+c[2],dn)+win(bl.x+c[3],dn)+door(bl.x+55);
  // rotes Haus
  s+=c.map(x=>win(rd.x+x,up)).join("")+win(rd.x+c[0],dn)+win(rd.x+c[1],dn)+win(rd.x+c[3],dn)+door(rd.x+97);
  // gelbes Haus: Flur mit Garderobe (Jacken an Haken)
  s+=c.map(x=>win(ye.x+x,up)).join("")+door(ye.x+138);
  { const jc=["#e8483f","#4a86f0","#5cb85c","#f2b632","#8e6cc7"], t=dn+11;
    s+=`<rect x="${ye.x+12}" y="${dn}" width="114" height="50" rx="3" fill="#eaf4fb" stroke="#1f2b3b" stroke-width="2.5"/><rect x="${ye.x+16}" y="${dn+5}" width="106" height="4" rx="2" fill="#8a6a43"/>`;
    s+=jc.map((col,i)=>{const cx=ye.x+29+i*20;return `<path d="M${cx} ${dn+9} v3" stroke="#56657a" stroke-width="2"/><path d="M${cx-3} ${t} L${cx+3} ${t} L${cx+8} ${t+4} L${cx+8} ${t+30} L${cx-8} ${t+30} L${cx-8} ${t+4} Z" fill="${col}" stroke="#1f2b3b" stroke-width="1.6" stroke-linejoin="round"/><path d="M${cx} ${t+3} V${t+30}" stroke="#1f2b3b" stroke-width="1.2"/><path d="M${cx-8} ${t+6} l-3 16 h3 M${cx+8} ${t+6} l3 16 h-3" fill="${col}" stroke="#1f2b3b" stroke-width="1.4" stroke-linejoin="round"/>`}).join(""); }
  return s;
}

function renderStation(){
  const s=ALL.find(x=>x.id===S.cur); const p=S.prog[s.id]||0; const n=s.steps.length;
  const pips=s.steps.map((st,i)=>`<i class="${i<p?(st.type==="info"?"on":"ok"):""}"></i>`).join("");
  let html=`${header()}
  <div class="stationhead"><button class="btn ghost" id="back">← Zur Karte</button><h2>${s.title}</h2><div class="pips" aria-label="Fortschritt ${Math.min(p,n)} von ${n}">${pips}</div></div>
  <div class="scene">${ICON[s.icon]}<div><div class="time">${s.place.toUpperCase()} · ${s.time}</div><p>${s.scene}</p></div></div>
  <div class="flow" id="flow">`;
  for(let i=0;i<Math.min(p+1,n);i++) html+=stepHTML(s,s.steps[i],i,i===p);
  if(p<n-1){ const left=n-1-p; html+=`<div class="locked-card">${ICON.lock}<span>Noch ${left} ${left===1?"Karte":"Karten"} gesperrt. ${s.steps[p].type==="info"?"Lies die Infokarte und tippe auf „Weiter“.":"Beantworte die Frage, um die nächste Karte freizuschalten."}</span></div>`; }
  if(p>=n) html+=endHTML(s);
  html+=`</div>`;
  app.innerHTML=html;
  bindStation(s);
  applyFlash();
}

function stepHTML(s,st,i,isCur){
  if(st.type==="info") return `<article class="card info" id="step${i}"><span class="tag">Infokarte</span><h3>${st.title}</h3>${st.html}
    ${isCur?`<div class="actions"><button class="btn" data-next>Verstanden, weiter</button></div>`:""}</article>`;
  if(st.type==="promise") return promiseHTML(st,isCur,i);
  const solved=!isCur || tmp[st.id]?.solved;
  if(st.type==="choice"){
    const t=tmp[st.id]||{wrong:[]};
    const isSolved=solved && (!isCur || t.solved);
    return `<article class="card quiz" id="step${i}"><span class="tag">Quizfrage</span><p class="q">${st.q}</p>
      <div class="opts">${ord(st).map((k,pos)=>{const o=st.options[k];
        const cls= (isSolved&&o.ok)?"right":(t.wrong.includes(k)?"wrong":"");
        return `<button class="opt ${cls}" data-opt="${k}" ${isSolved||t.wrong.includes(k)?"disabled":""}><span class="k">${"ABCD"[pos]}</span><span>${o.t}</span></button>`}).join("")}</div>
      ${t.last!=null && !isSolved?`<div class="fb try" role="status"><b>Noch nicht ganz.</b>${st.options[t.last].fb||"Versuch es noch einmal."} Versuch es noch einmal!</div>`:""}
      ${isSolved?`<div class="fb good" role="status"><b>${S.first[st.id]?"Richtig, beim ersten Versuch! +1 Mut-Stern":"Richtig!"}</b>${st.explain}</div>`:""}
      ${isCur&&isSolved?`<div class="actions"><button class="btn" data-next>Weiter</button></div>`:""}
    </article>`;
  }
  if(st.type==="sort"){
    const t=tmp[st.id]||{sel:{},checked:false,res:{}};
    const isSolved=!isCur || t.solved;
    return `<article class="card quiz" id="step${i}"><span class="tag">Quizfrage · Zuordnen</span><p class="q">${st.q}</p>
      <div class="sortlist">${ord(st).map(k=>{const it=st.items[k];
        const sel=isSolved?it.c:t.sel[k]; const rc=isSolved?"right":(t.res[k]===true?"right":t.res[k]===false?"wrong":"");
        return `<div class="sortrow ${rc}"><span>${it.t}</span><div class="cats" role="group" aria-label="Zuordnung">${st.cats.map((c,ci)=>`<button class="cat ${sel===ci?"sel":""}" data-item="${k}" data-cat="${ci}" ${isSolved||t.res[k]===true?"disabled":""} aria-pressed="${sel===ci}">${c}</button>`).join("")}</div></div>`}).join("")}</div>
      ${!isSolved&&t.checked?`<div class="fb try" role="status"><b>Fast!</b>Die rot markierten Karten stimmen noch nicht. Ändere sie und prüfe noch einmal.</div>`:""}
      ${isSolved?`<div class="fb good" role="status"><b>${S.first[st.id]?"Alles richtig, beim ersten Versuch! +1 Mut-Stern":"Alles richtig!"}</b>${st.explain}</div>`:""}
      <div class="actions">${!isSolved?`<button class="btn green" data-check ${Object.keys(t.sel).length<st.items.length?"disabled":""}>Prüfen</button><small style="color:var(--muted)">${Object.keys(t.sel).length}/${st.items.length} zugeordnet</small>`:(isCur?`<button class="btn" data-next>Weiter</button>`:"")}</div>
    </article>`;
  }
}

function promiseHTML(st,isCur,i){

function advance(s){
  S.prog[s.id]=(S.prog[s.id]||0)+1;
  if(S.prog[s.id]>=s.steps.length) S.done[s.id]=true;
  save(); renderStation();
  const id=S.prog[s.id]>=s.steps.length?"endcard":"step"+S.prog[s.id];
  const el=document.getElementById(id);
  if(el){
    el.classList.add("new");
    el.scrollIntoView({behavior:RM?"auto":"smooth",block:"center"});
    if(id==="endcard") setTimeout(()=>confetti(innerWidth/2,innerHeight*0.35,150,1.4),350);
  }
}

function bindStation(s){
  document.getElementById("back").addEventListener("click",()=>{S.view="map";save();render();window.scrollTo(0,0);});
  const p=S.prog[s.id]||0; const st=s.steps[p];
  app.querySelectorAll("[data-next]").forEach(b=>b.addEventListener("click",()=>advance(s)));
  if(st && st.type==="choice"){
    app.querySelectorAll(`#step${p} [data-opt]`).forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.opt; const t=tmp[st.id]||(tmp[st.id]={wrong:[]});
      if(st.options[k].ok){ t.solved=true; if(S.first[st.id]==null) S.first[st.id]=t.wrong.length===0; flash={kind:"good",step:p,star:S.first[st.id]===true&&t.wrong.length===0}; }
      else { t.wrong.push(k); t.last=k; if(S.first[st.id]==null) S.first[st.id]=false; flash={kind:"bad",step:p,opt:k}; }
      save(); renderStation(); document.getElementById("step"+p)?.scrollIntoView({block:"nearest"});
    }));
  }
  if(st && st.type==="sort"){
    app.querySelectorAll(`#step${p} [data-item]`).forEach(b=>b.addEventListener("click",()=>{
      const t=tmp[st.id]||(tmp[st.id]={sel:{},checked:false,res:{}});
      const k=+b.dataset.item; t.sel[k]=+b.dataset.cat; if(t.res[k]===false) delete t.res[k];
      renderStation(); document.getElementById("step"+p)?.scrollIntoView({block:"nearest"});
    }));
    const c=app.querySelector(`#step${p} [data-check]`);
    if(c) c.addEventListener("click",()=>{
      const t=tmp[st.id]; t.checked=true; let all=true;
      st.items.forEach((it,k)=>{const ok=t.sel[k]===it.c; t.res[k]=ok; if(!ok) all=false;});
      const firstCheck=S.first[st.id]==null;
      if(firstCheck) S.first[st.id]=all;
      if(all){ t.solved=true; flash={kind:"good",step:p,star:firstCheck}; }
      else flash={kind:"bad",step:p};
      save(); renderStation(); document.getElementById("step"+p)?.scrollIntoView({block:"nearest"});
    });
  }
  if(st && st.type==="promise"){
    app.querySelectorAll("[data-pr]").forEach(cb=>cb.addEventListener("change",()=>{
      const k=+cb.dataset.pr; S.promises=S.promises.filter(x=>x!==k); if(cb.checked) S.promises.push(k); S.promises.sort();
      save(); const btn=app.querySelector("[data-promise]"); if(btn) btn.disabled=!S.promises.length;
    }));
    app.querySelector("[data-promise]")?.addEventListener("click",()=>advance(s));
  }
  document.getElementById("tomap")?.addEventListener("click",()=>{S.view="map";save();render();window.scrollTo(0,0);});
  document.getElementById("tocert")?.addEventListener("click",()=>{S.view="cert";save();render();window.scrollTo(0,0);});
}

  c.fillStyle="#1f2b3b"; c.font=`400 36px ${B}`;
  c.fillText("hat an der MPS St. Blasius die Mut-Tour durch Schulbus, Schulhof, Klassenzimmer,",W/2,730);

  const n=stars(), tot=QIDS.length, sz=34, gap=10, rowW=tot*(sz*2)+(tot-1)*gap; let x=W/2-rowW/2+sz;
  for(let i=0;i<tot;i++){ starPath(c,x,850,sz,sz*0.45); c.fillStyle=i<n?"#f2b632":"#e4eaf1"; c.fill(); c.lineWidth=3; c.strokeStyle="#1f2b3b"; c.stroke(); x+=sz*2+gap; }

function starPath(c,cx,cy,R,r){ c.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; c.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr); } c.closePath(); }
function canvasBlob(cv,type,q){ return new Promise(res=>cv.toBlob(res,type,q)); }
function pdfFromJpeg(jpg,w,h){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x; parts.push(b); len+=b.length;};
  const obj=(n,f)=>{offs[n]=len; push(n+" 0 obj\n"); f(); push("\nendobj\n");};
  push("%PDF-1.4\n");
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
  obj(3,()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>"));
  const cs="q 842 0 0 595 0 0 cm /Im0 Do Q";
  obj(4,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  obj(5,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push("\nendstream");});
  const xref=len; let t="xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++) t+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(t+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  return new Blob(parts,{type:"application/pdf"});
}
async function offerFile(blob,filename){
  const msg=document.getElementById("dlmsg");
  let dl=null;
  if(window.claude&&typeof window.claude.use==="function"){ try{ dl=await window.claude.use("downloads"); }catch(e){ dl=null; } }
  if(dl){
    try{ await dl.save({filename,data:blob}); if(msg) msg.textContent="Gespeichert: "+filename; }
    catch(e){ if(msg) msg.textContent=(e&&e.code==="declined")?"Download abgebrochen.":(e&&e.code==="rate_limited")?"Bitte einen Moment warten und noch einmal tippen.":"Der Download ist in dieser Ansicht leider nicht möglich."; }
    return;
  }
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(isIOS&&navigator.canShare){
    try{
      const f=new File([blob],filename,{type:blob.type});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); if(msg) msg.textContent="Urkunde zum Sichern geöffnet: "+filename; return; }
    }catch(e){ if(e&&e.name==="AbortError"){ if(msg) msg.textContent="Download abgebrochen."; return; } }
  }
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  if(msg) msg.textContent="Download gestartet: "+filename;
}
async function downloadCert(kind,btn){
  const msg=document.getElementById("dlmsg"); btn.disabled=true; const old=btn.textContent; btn.textContent="Wird erstellt …";
  try{
    const cv=await drawCert();
    const base="Urkunde_Mut-Tour_"+((S.name||"Klasse").replace(/[^\wäöüÄÖÜß -]/g,"").trim().replace(/\s+/g,"_")||"Klasse");
    if(kind==="png"){ await offerFile(await canvasBlob(cv,"image/png"),base+".png"); }
    else { const jb=await canvasBlob(cv,"image/jpeg",0.92); const jpg=new Uint8Array(await jb.arrayBuffer()); await offerFile(pdfFromJpeg(jpg,cv.width,cv.height),base+".pdf"); }
  }catch(e){ if(msg) msg.textContent="Die Urkunde konnte nicht erstellt werden."; }
  btn.disabled=false; btn.textContent=old;
}

/* ---------- Zufällige Reihenfolge der Antworten ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sortScore(st,o){
  const c=o.map(k=>st.items[k].c), n=c.length, cats=new Set(c).size;
  let sc=0;
  for(let i=2;i<n;i++) if(c[i]===c[i-1]&&c[i]===c[i-2]) sc+=10;          // keine 3 gleichen hintereinander
  if(n>3 && cats>1){ let per=true; for(let i=cats;i<n;i++) if(c[i]!==c[i-cats]) per=false; if(per) sc+=8; } // kein ABAB / ABCABC
  if(o.every((k,i)=>k===i)) sc+=8;                                          // nicht die Originalreihenfolge
  return sc;
}
function buildOrders(){
  S.order=S.order||{};
  let prev=-1;
  ALL.forEach(s=>s.steps.forEach(st=>{
    if(st.type==="choice"){
      const n=st.options.length, ci=st.options.findIndex(o=>o.ok), idn=[...Array(n).keys()];
      let o=S.order[st.id];
      if(!o||o.length!==n){
        if(st.fixed) o=idn;
        else for(let t=0;t<100;t++){ o=shuffle(idn); if(o.indexOf(ci)!==prev) break; }
        S.order[st.id]=o;
      }
      prev=o.indexOf(ci);
    } else if(st.type==="sort" && (!S.order[st.id]||S.order[st.id].length!==st.items.length)){
      const idn=[...Array(st.items.length).keys()]; let best=idn,bs=1e9;
      for(let t=0;t<400;t++){ const o=shuffle(idn), sc=sortScore(st,o); if(sc<bs){best=o;bs=sc;} if(sc===0) break; }
      S.order[st.id]=best;
    }
  }));
  save();
}
function ord(st){ if(!S.order||!S.order[st.id]) buildOrders(); return S.order[st.id]; }

/* ---------- Effekte ---------- */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let flash=null;
function applyFlash(){
  if(!flash) return; const f=flash; flash=null;
  const step=document.getElementById("step"+f.step); if(!step) return;
  step.querySelectorAll(".fb").forEach(e=>e.classList.add("new"));
  if(f.kind==="good"){
    const src=step.querySelector(".opt.right")||step.querySelector(".fb.good")||step;
    const r=src.getBoundingClientRect(); confetti(r.left+r.width/2,r.top+r.height/2,f.star?70:40);
    if(f.star) setTimeout(()=>flyStar(src),150);
  } else {
    if(f.opt!=null) step.querySelector(`[data-opt="${f.opt}"]`)?.classList.add("shake");
    step.querySelectorAll(".sortrow.wrong").forEach(e=>e.classList.add("shake"));
  }
}
let cv,ctx,parts=[],raf=0;
function confetti(x,y,n=60,spread=1){
  if(RM) return;
  if(!cv){cv=document.createElement("canvas");cv.setAttribute("aria-hidden","true");cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";document.body.appendChild(cv);ctx=cv.getContext("2d");}
  const dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#f2b632","#2f5d50","#c8553d","#7fb2d9","#23845a","#e59a7c"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(3+Math.random()*6)*spread;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4*spread,r:5+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0,round:Math.random()<.3});}
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life<110&&p.y<innerHeight+40);
  for(const p of parts){
    p.life++;p.vy+=.22;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    ctx.save();ctx.globalAlpha=Math.max(0,1-p.life/110);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    if(p.round){ctx.beginPath();ctx.arc(0,0,p.r*.55,0,7);ctx.fill();} else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
    ctx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
}
function flyStar(src){
  if(RM) return; const chip=document.getElementById("starchip"); if(!chip) return;
  const a=src.getBoundingClientRect(), b=chip.getBoundingClientRect();
  const sx=a.left+a.width/2, sy=a.top+a.height/2;
  const el=document.createElement("div"); el.innerHTML=ICON.star(); el.firstChild.style.cssText="width:100%;height:100%;display:block";
  el.style.cssText=`position:fixed;left:${sx-22}px;top:${sy-22}px;width:44px;height:44px;z-index:60;pointer-events:none`;
  document.body.appendChild(el);
  const dx=b.left+20-sx, dy=b.top+b.height/2-sy;
  el.animate([{transform:"translate(0,0) scale(.6) rotate(0deg)"},{transform:`translate(${dx*.4}px,${dy*.4-90}px) scale(1.7) rotate(180deg)`,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.45) rotate(360deg)`}],{duration:1000,easing:"ease-in-out"}).onfinish=()=>{el.remove();chip.classList.remove("pulse");void chip.offsetWidth;chip.classList.add("pulse");};
}

function guideText(nx,allDone){
  const d=STATIONS.filter(s=>S.done[s.id]).length;
  if(allDone) return "Wow, du hast die ganze Mut-Tour geschafft! Hol dir deine <b>Urkunde</b> ab.";
  if(nx&&nx.id==="finale") return "Alle fünf Stationen geschafft! Jetzt ist die <b>Aula</b> offen. Dort findest du heraus, was wirklich hilft.";
  if(d===0) return `Hallo${S.name?" "+esc(S.name):""}! Ich bin Erdmännchen Emil und führe dich durch die Tour. Starte im <b>Schulbus</b>!`;
  const cheer=["Stark","Super","Klasse","Toll"][d%4];
  return `${cheer}, schon ${d} von ${STATIONS.length} Stationen geschafft! Weiter geht’s: <b>${nx?nx.place:""}</b>.`;
}

/* Spielstand bleibt bei Updates erhalten */
function start(data){ if(data&&data.S){S=data.S;tmp=data.tmp||{};} S.promises=(S.promises||[]).filter(k=>k<3); render(); }
window.claude?.hot?.snapshot?.(()=>({S,tmp}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
